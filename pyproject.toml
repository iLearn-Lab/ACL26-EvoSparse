[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evosparse"
version = "0.1.0"
description = "Official implementation of EvoSparse (ACL 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "Ruizi Han"},
  {name = "Miao Zhang"},
  {name = "Ziyue Qiao"},
  {name = "Liqiang Nie"},
]
dependencies = [
  "torch==2.8.0",
  "transformers==4.52.4",
  "accelerate==1.8.1",
  "safetensors==0.6.2",
  "sentencepiece==0.2.1",
  "tokenizers==0.21.4",
]

[project.optional-dependencies]
experiments = [
  "datasets==3.6.0",
  "numpy==1.23.5",
  "pyyaml==6.0.2",
  "tqdm==4.67.1",
  "rouge==1.0.1",
  "jieba==0.42.1",
  "fuzzywuzzy==0.18.0",
  "html2text==2025.4.15",
  "nltk==3.9.1",
  "pandas==2.3.0",
  "scipy==1.15.3",
  "tenacity==9.1.2",
  "wonderwords==3.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
